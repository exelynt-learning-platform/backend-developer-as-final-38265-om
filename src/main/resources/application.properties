spring.application.name=Booking

# Database Configuration (Strict Environment Variables Only - No Fallbacks)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (Changed default fallback to safe 'validate')
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Security Configuration (Strict Environment Variable Only - No Fallbacks)
jwt.secret=${JWT_SECRET}
jwt.issuer=booking-api
jwt.audience=booking-clients
# 15 minutes
jwt.expiration-ms=900000
# Pagination Configurations
app.reservation.max-page-size=${MAX_PAGE_SIZE:100}

# 30 seconds allowed time difference drift
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}
